# ==============================================================================
# Lucid Trading - Reglas de Cuentas y Configuración del Gate de Autorización
# Fuente: Rules/Lucid.xlsx (LucidFlex)
# ==============================================================================

server:
  host: "127.0.0.1"
  port: 8765
  timeout_ms: 200                    # Tiempo maximo para responder antes de rechazo (fail-closed)
  heartbeat_interval_seconds: 5      # Intervalo de latido obligatorio
  default_fail_action: "flatten"     # "hold" | "flatten" al perder conexion o heartbeat
  audit_log_path: "logs/gate_audit.log"
  log_timezone: "America/Chicago"    # Zona horaria de logs/timestamps. Para reloj fijo de Costa Rica (UTC-6): "America/Costa_Rica"

# Hora oficial del CME = America/Chicago (CST invierno UTC-6 / CDT verano UTC-5, con DST).
# Costa Rica es UTC-6 todo el año: coincide con Chicago solo en invierno (nov-mar).
session:
  mode: "24h_with_break"              # Opera 24hs continuo excepto en el break del CME
  timezone: "America/Chicago"         # Las horas de abajo y de los presets estan en esta zona
  daily_break_start: "16:00"          # 16:00 CT = 17:00 ET: inicio del break de mantenimiento (L-J) / cierre semanal (V)
  daily_break_end: "17:00"            # 17:00 CT = 18:00 ET: reapertura Globex (diaria y domingo)
  pre_break_buffer_minutes: 5         # Bloquear entradas 5 min antes del break (15:55 CT)

instruments:
  NQ:
    type: "mini"
    point_value: 20.0
    tick_size: 0.25
    tick_value: 5.00
    description: "E-mini NASDAQ-100 Futures"
  MNQ:
    type: "micro"
    point_value: 2.0
    tick_size: 0.25
    tick_value: 0.50
    description: "Micro E-mini NASDAQ-100 Futures"

presets:
  "25k_flex_eval":
    tier: "25K"
    phase: "eval"
    initial_balance: 25000.0
    profit_target: 1250.0
    daily_loss_limit: 600.0
    max_loss_limit: 1000.0           # Trailing DD total
    drawdown_type: "EOD"             # End of Day trailing drawdown
    consistency_cap_pct: 0.50        # Ningun dia puede aportar mas del 50% del profit total
    lock_day_after_consistency_cap: true # Bloquear nuevas entradas si hoy se alcanza el 50%
    min_account_balance: 24000.0     # Piso de liquidacion inicial
    max_contracts_mini: 2            # Maximo contratos NQ
    max_contracts_micro: 20          # Maximo contratos MNQ
    min_trade_duration_seconds: 10.0 # Bloqueo anti-microscalping
    session_start_time: "08:30"            # 09:30 ET = 08:30 CT
    session_flatten_time: "14:55"         # 15:55 ET = 14:55 CT (antes del cierre de cash 15:00 CT)

  "50k_flex_eval":
    tier: "50K"
    phase: "eval"
    initial_balance: 50000.0
    profit_target: 3000.0
    daily_loss_limit: 1200.0
    max_loss_limit: 2000.0
    drawdown_type: "EOD"
    consistency_cap_pct: 0.50
    lock_day_after_consistency_cap: true
    min_account_balance: 48000.0
    max_contracts_mini: 4
    max_contracts_micro: 40
    min_trade_duration_seconds: 10.0
    session_start_time: "08:30"            # 09:30 ET = 08:30 CT
    session_flatten_time: "14:55"

  "100k_flex_eval":
    tier: "100K"
    phase: "eval"
    initial_balance: 100000.0
    profit_target: 6000.0
    daily_loss_limit: 1800.0
    max_loss_limit: 3000.0
    drawdown_type: "EOD"
    consistency_cap_pct: 0.50
    lock_day_after_consistency_cap: true
    min_account_balance: 97000.0
    max_contracts_mini: 6
    max_contracts_micro: 60
    min_trade_duration_seconds: 10.0
    session_start_time: "08:30"            # 09:30 ET = 08:30 CT
    session_flatten_time: "14:55"

  "25k_flex_funded":
    tier: "25K"
    phase: "funded"
    initial_balance: 25000.0
    profit_target: null
    daily_loss_limit: 600.0          # DLL cuando esta por debajo del trail inicial
    max_loss_limit: 1000.0
    drawdown_type: "EOD"
    consistency_cap_pct: null
    min_account_balance: 25100.0     # Piso de liquidacion: el trailing deja de subir aqui; por debajo se pierde la cuenta
    min_days_of_profit: "5 of $100"
    min_profit_day_amount: 100.0     # Minimo $100 por dia para calificar
    min_profit_days_required: 5      # 5 dias de ganancia requeridos
    lock_day_after_qualifying_profit: true # Tras alcanzar balance_for_payout: bloquear el dia al llegar a min_profit_day_amount
    buffer: 1100.0                  # Rules/Lucid.xlsx (Buffer)
    payout: 1000.0                  # Rules/Lucid.xlsx (Payout)
    # balance_for_payout = initial_balance + buffer + payout (se calcula; null mientras falte buffer o payout)
    days_to_payout: 5
    scaling_plan: true
    max_contracts_mini: 2
    max_contracts_micro: 20
    min_trade_duration_seconds: 10.0
    session_start_time: "08:30"            # 09:30 ET = 08:30 CT
    session_flatten_time: "14:55"

